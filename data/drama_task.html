<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drama Monitor</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111827;--panel2:#151f30;--line:#253248;--muted:#8c9bb2;--text:#e8eef8;--blue:#5795ff;--green:#35c995;--red:#ff687b;--amber:#f2b95e;--purple:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#172b4b 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1600px;margin:auto;padding:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#478cff,#7b69ef);display:grid;place-items:center;font-size:21px;box-shadow:0 8px 28px #3979e955}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#172235;color:var(--text);padding:9px 13px;border-radius:10px;font-weight:600;font-size:12px}.btn:hover{border-color:#5478aa;background:#1b2b43}.btn.primary{background:var(--blue);border-color:var(--blue);color:#071323}.btn.ghost{background:transparent}
.pagehead{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px;gap:12px}.pagehead h2{font-size:24px;margin:0;letter-spacing:-.7px}.pagehead p{margin:4px 0 0;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:22px}.kpi{background:linear-gradient(145deg,#141f31,#101725);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.kpi-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.kpi-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#20375a;color:#8db7ff}.kpi strong{display:block;font-size:25px;letter-spacing:-.7px;margin-top:12px;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:11px}
.panel{background:#0f1725d9;border:1px solid var(--line);border-radius:16px;overflow:hidden}.toolbar{padding:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.search{flex:1;min-width:220px;position:relative}.search input{width:100%;padding:10px 12px 10px 36px}.search:before{content:"⌕";position:absolute;left:13px;top:5px;color:var(--muted);font-size:22px}
input,select{background:#0b1220;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #5795ff20}select{min-width:130px}.toolbar .count{color:var(--muted);font-size:11px;margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:15px}.task-card{background:linear-gradient(155deg,#172235,#111a29);border:1px solid #29384f;border-radius:14px;padding:15px;min-width:0;transition:.18s}.task-card:hover{transform:translateY(-2px);border-color:#49668f;box-shadow:0 10px 25px #0003}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.userline{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:#263d60;color:#a9caff;font-weight:800}.username{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.taskid{color:var(--muted);font-size:10px;margin-top:1px}.status{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid transparent}.status.running{background:#14382f;color:#5be0b1;border-color:#24644f}.status.failed{background:#3d202a;color:#ff8c9b;border-color:#703444}.status.done{background:#203251;color:#9cc4ff;border-color:#385986}.status.other{background:#342d20;color:#f5c66e;border-color:#63502e}
.progress-row{display:flex;justify-content:space-between;margin:17px 0 7px;font-size:11px}.progress-row span:last-child{color:#c6d5eb;font-weight:700}.progress{height:7px;background:#263247;border-radius:10px;overflow:hidden}.progress>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#478cff,#46d5b0);width:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.metric{background:#0c1422;border:1px solid #202e42;border-radius:9px;padding:9px}.metric label{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px}.metric b{display:block;font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logline{margin-top:12px;padding-top:10px;border-top:1px solid #263247;color:#aab8cc;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:10px}.linkbtn{border:0;background:transparent;color:#82b2ff;font-size:11px;font-weight:700;padding:3px}.linkbtn:hover{color:#c4dcff}
.empty{padding:55px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.pages{display:flex;gap:6px}.pages button{min-width:30px;padding:6px;border-radius:7px;border:1px solid var(--line);background:#172235;color:var(--text);font-size:11px}.pages button.active{background:var(--blue);color:#061326;border-color:var(--blue)}
.overlay{position:fixed;inset:0;background:#030711c9;backdrop-filter:blur(6px);z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#111b2b;border:1px solid #34445c;border-radius:17px;box-shadow:0 25px 90px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:16px}.close{border:0;background:#202d41;color:#cbd8e9;border-radius:8px;width:30px;height:30px;font-size:18px}.modal-body{padding:19px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail{padding:11px;background:#0c1422;border:1px solid #25344a;border-radius:10px;min-width:0}.detail label{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.detail strong{font-size:13px;overflow-wrap:anywhere}.section-title{font-size:12px;color:#b9c9df;margin:20px 0 9px}.fingerprint{font:10px/1.6 ui-monospace,monospace;color:#9eacc0;background:#0a111e;border:1px solid #263247;padding:11px;border-radius:9px;overflow-wrap:anywhere}.logbox{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a111e;border:1px solid #263247;border-radius:9px;padding:12px;color:#a9c4e5;font:11px/1.6 ui-monospace,monospace;max-height:180px;overflow:auto}.modal-actions{display:flex;gap:8px;margin-top:9px}.muted{color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d344c;border:1px solid #41638b;padding:10px 15px;border-radius:10px;color:#dceaff;z-index:30;display:none;font-size:12px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.app{padding:16px}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.pagehead{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr);gap:9px}.kpi{padding:12px}.kpi strong{font-size:21px}.cards{grid-template-columns:1fr;padding:10px}.toolbar{padding:11px}.search{min-width:100%}.toolbar select{flex:1;min-width:0}.toolbar .count{margin-left:0}.detail-grid{grid-template-columns:repeat(2,1fr)}.pagination{gap:10px;flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">▶</div><div><h1>Drama Monitor</h1><p>Task monitoring · Account activity</p></div></div>
    <div class="top-actions">
      <button class="btn ghost" id="exportBtn">↓ Export JSON</button>
      <button class="btn" id="importBtn">↑ Import JSON</button>
      <input id="fileInput" type="file" accept=".json,application/json" hidden>
      <button class="btn primary" id="resetBtn">Reset data</button>
    </div>
  </header>

  <div class="pagehead"><div><h2>Overview</h2><p id="subtitle">Ringkasan aktivitas drama task</p></div><span class="muted" id="lastUpdated">Data lokal</span></div>
  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <div class="toolbar">
      <div class="search"><input id="searchInput" type="search" placeholder="Cari username, ID, atau judul drama..." aria-label="Cari task"></div>
      <select id="statusFilter" aria-label="Filter status"><option value="">Semua status</option><option value="dijalankan">Dijalankan</option><option value="gagal">Gagal</option><option value="selesai">Selesai</option><option value="other">Lainnya</option></select>
      <select id="sortSelect" aria-label="Urutkan"><option value="updated">Terbaru diupdate</option><option value="progress">Progress tertinggi</option><option value="coins">Drama balance tertinggi</option><option value="withdrawn">Withdrawn tertinggi</option><option value="id">ID terbesar</option></select>
      <select id="pageSize" aria-label="Jumlah per halaman"><option value="12">12 / halaman</option><option value="24" selected>24 / halaman</option><option value="48">48 / halaman</option></select>
      <span class="count" id="resultCount"></span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="pagination"><span id="pageInfo"></span><div class="pages" id="pages"></div></div>
  </section>
</div>

<div class="overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="modal"><div class="modal-head"><h3 id="detailTitle">Detail task</h3><button class="close" id="closeModal" aria-label="Tutup">×</button></div><div class="modal-body" id="detailBody"></div></div>
</div>
<div class="toast" id="toast"></div>

 const running=tasks.filter(t=>t.status==='dijalankan').length;
 const failed=tasks.filter(t=>t.status==='gagal').length;
 const done=tasks.filter(t=>t.status==='selesai').length;
 const data=[
  ['Total drama task',tasks.length,'Semua data task','▦'],
  ['Sedang berjalan',running,'Status dijalankan','◷'],
  ['Selesai',done,'Status selesai','✓'],
  ['Gagal',failed,'Perlu ditinjau','!'],
  ['Drama balance',number(total('drama_balance')),'Akumulasi saldo','◈']
 ];
 $('kpis').innerHTML=data.map((x,i)=>`<article class="kpi"><div class="kpi-top"><span>${x[0]}</span><span class="kpi-icon">${x[3]}</span></div><strong>${x[1]}</strong><small>${x[2]}</small></article>`).join('');
 $('subtitle').textContent=`${number(sourceData.total_drama_tasks ?? tasks.length)} total drama task · ${number(sourceData.total_active_drama_tasks ?? running)} task aktif`;
 $('lastUpdated').textContent=`${number(total('withdrawn_amount'))} koin telah ditarik`;
}
function filteredTasks(){
 const q=$('searchInput').value.trim().toLowerCase(), st=$('statusFilter').value, sort=$('sortSelect').value;
 let list=tasks.filter(t=>{
  const hay=[t.username,t.id,t.result_log].join(' ').toLowerCase();
  const statusOk=!st || (st==='other'?!['dijalankan','gagal','selesai'].includes(t.status):t.status===st);
  return (!q||hay.includes(q))&&statusOk;
 });
 list.sort((a,b)=>{
  if(sort==='progress') return pct(b)-pct(a);
  if(sort==='coins') return (Number(b.drama_balance)||0)-(Number(a.drama_balance)||0);
  if(sort==='withdrawn') return (Number(b.withdrawn_amount)||0)-(Number(a.withdrawn_amount)||0);
  if(sort==='id') return (Number(b.id)||0)-(Number(a.id)||0);
  return String(b.updated_at||'').localeCompare(String(a.updated_at||''));
 });
 return list;
}
function render(){
 renderKpis();
 const list=filteredTasks(), size=Number($('pageSize').value), pages=Math.max(1,Math.ceil(list.length/size));
 currentPage=Math.min(currentPage,pages);
 const start=(currentPage-1)*size, shown=list.slice(start,start+size);
 $('resultCount').textContent=`${number(list.length)} hasil`;
 $('cards').innerHTML=shown.length?shown.map(t=>{
  const p=pct(t), s=statusType(t.status);
  return `<article class="task-card">
   <div class="card-head"><div class="userline"><div class="avatar">${safe((t.username||'?').slice(0,1).toUpperCase())}</div><div style="min-width:0"><div class="username">${safe(t.username||'Tanpa username')}</div><div class="taskid">TASK #${safe(t.id)}</div></div></div><span class="status ${s}">${safe(t.status||'unknown')}</span></div>
   <div class="progress-row"><span>Progress menonton</span><span>${number(t.minutes_watched)} / ${number(t.target_minutes)} menit · ${p.toFixed(1)}%</span></div>
   <div class="progress"><i style="width:${p}%"></i></div>
   <div class="metrics">
    <div class="metric"><label>Current coins</label><b>${number(t.current_coins)}</b></div>
    <div class="metric"><label>Drama balance</label><b>${number(t.drama_balance)}</b></div>
    <div class="metric"><label>Withdrawn</label><b>${number(t.withdrawn_amount)}</b></div>
   </div>
   <div class="logline" title="${safe(t.result_log)}">${safe(t.result_log||'Belum ada result log')}</div>
   <div class="card-foot"><span>Update ${safe(formatDate(t.updated_at))}</span><button class="linkbtn" data-detail="${safe(t.id)}">Lihat detail ↗</button></div>
  </article>`;
 }).join(''):'<div class="empty">Tidak ada task yang cocok dengan filter.</div>';
 $('pageInfo').textContent=`Menampilkan ${list.length?start+1:0}–${Math.min(start+size,list.length)} dari ${number(list.length)} task`;
 $('pages').innerHTML='';
 const add=(label,page,disabled=false,active=false)=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;if(active)b.classList.add('active');b.onclick=()=>{currentPage=page;render()};$('pages').appendChild(b)};
 add('‹',Math.max(1,currentPage-1),currentPage===1);
 const lo=Math.max(1,currentPage-2), hi=Math.min(pages,lo+4);
 for(let p=lo;p<=hi;p++)add(p,p,false,p===currentPage);
 add('›',Math.min(pages,currentPage+1),currentPage===pages);
}
function showDetail(id){
 const t=tasks.find(x=>String(x.id)===String(id)); if(!t)return; activeTask=t;
 $('detailTitle').textContent=`${t.username||'Task'} · #${t.id}`;
 const fields=[['Username',t.username],['Task ID',t.id],['Status',t.status],['Target menit',number(t.target_minutes)],['Menit ditonton',number(t.minutes_watched)],['Progress',pct(t).toFixed(1)+'%'],['Current coins',number(t.current_coins)],['Drama balance',number(t.drama_balance)],['Withdrawn amount',number(t.withdrawn_amount)],['Auto withdraw',Number(t.auto_withdraw)===1?'Aktif':'Nonaktif'],['Created at',formatDate(t.created_at)],['Updated at',formatDate(t.updated_at)]];
 $('detailBody').innerHTML=`<div class="detail-grid">${fields.map(([k,v])=>`<div class="detail"><label>${safe(k)}</label><strong>${safe(v??'-')}</strong></div>`).join('')}</div>
 <h4 class="section-title">Fingerprint</h4><div class="fingerprint" id="fingerprintText">••••••••••••••••••••••••••••••••••••••••••••••••</div><div class="modal-actions"><button class="btn" id="revealFingerprint">Reveal fingerprint</button><button class="btn" id="copyFingerprint">Copy fingerprint</button></div>
 <h4 class="section-title">Result log</h4><div class="logbox">${safe(t.result_log||'Tidak ada log.')}</div>`;
 $('detailOverlay').classList.add('show');
 $('revealFingerprint').onclick=()=>{$('fingerprintText').textContent=t.fingerprint||'-';$('revealFingerprint').textContent='Fingerprint ditampilkan'};
 $('copyFingerprint').onclick=()=>copyText(t.fingerprint||'');
}
function copyText(v){if(!v)return; if(navigator.clipboard?.writeText){navigator.clipboard.writeText(v).then(()=>toast('Berhasil disalin')).catch(()=>toast('Gagal menyalin'));}else{const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Berhasil disalin')}}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function download(name,content){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('cards').addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(b)showDetail(b.dataset.detail)});
$('closeModal').onclick=()=>$('detailOverlay').classList.remove('show');
$('detailOverlay').addEventListener('click',e=>{if(e.target===$('detailOverlay'))$('detailOverlay').classList.remove('show')});
['searchInput','statusFilter','sortSelect','pageSize'].forEach(id=>$(id).addEventListener(id==='searchInput'?'input':'change',()=>{currentPage=1;render()}));
$('exportBtn').onclick=()=>download('drama_task_export.json',JSON.stringify({...sourceData,drama_tasks:filteredTasks()},null,2));
$('importBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed.drama_tasks))throw Error('Properti drama_tasks tidak ditemukan');sourceData=parsed;tasks=[...parsed.drama_tasks];currentPage=1;render();toast(`${tasks.length} task berhasil dimuat`)}catch(err){alert('JSON tidak valid: '+err.message)}e.target.value=''};
$('resetBtn').onclick=()=>{if(!confirm('Kembalikan data ke JSON awal yang tertanam di halaman ini?'))return;sourceData=INITIAL_DATA;tasks=[...INITIAL_DATA.drama_tasks];currentPage=1;$('searchInput').value='';$('statusFilter').value='';render();toast('Data awal dipulihkan')};
render();
</script>
</body>
</html>
